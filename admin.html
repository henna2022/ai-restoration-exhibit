<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 · 나도 복원가</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#614c99; --gold:#C9A84C; --gold-dark:#8B6914;
    --brown:#2A1810; --bg:#FDF6E9; --paper:#F5EDD8;
    --text:#2C1810; --muted:#9B7B6A; --border:#D4B896; --danger:#B83232;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Noto Sans KR',sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  header{
    background:var(--brown); color:#fff; padding:18px 20px;
    display:flex; align-items:center; gap:12px;
  }
  header img{height:30px; width:auto;}
  header h1{font-size:18px; font-weight:700; margin:0; letter-spacing:.5px;}
  header .sub{font-size:12px; color:rgba(255,255,255,.55); margin-left:auto;}
  main{max-width:760px; margin:0 auto; padding:22px 18px 60px;}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  @media(max-width:600px){ .cards{grid-template-columns:repeat(2,1fr);} }
  .card{
    background:#fff; border:1.5px solid var(--border); border-radius:14px;
    padding:16px 14px; text-align:center;
  }
  .card .label{font-size:13px; color:var(--muted); font-weight:500; margin-bottom:6px;}
  .card .num{font-size:34px; font-weight:900; line-height:1; font-feature-settings:"tnum";}
  .card.primary .num{color:var(--primary);}
  .card.gold .num{color:var(--gold-dark);}

  .panel{
    background:#fff; border:1.5px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:18px;
  }
  .panel h2{font-size:15px; margin:0 0 14px; color:var(--brown);}
  .meta-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #e7d9bf; font-size:14px;}
  .meta-row:last-child{border-bottom:none;}
  .meta-row span:first-child{color:var(--muted);}
  .meta-row span:last-child{font-weight:600;}

  .bar-row{display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px;}
  .bar-label{width:48px; color:var(--muted); flex-shrink:0;}
  .bar-track{flex:1; height:18px; background:var(--paper); border-radius:9px; overflow:hidden;}
  .bar-fill{display:block; height:100%; background:linear-gradient(90deg,var(--primary),var(--gold)); border-radius:9px; min-width:2px; transition:width .4s ease;}
  .bar-n{width:32px; text-align:right; font-weight:700; flex-shrink:0;}

  .actions{display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    border:none; border-radius:10px; padding:12px 18px; transition:opacity .15s;
  }
  button:hover{opacity:.88;}
  .btn-main{background:var(--primary); color:#fff;}
  .btn-ghost{background:var(--paper); color:var(--text); border:1.5px solid var(--border);}
  .btn-danger{background:#fff; color:var(--danger); border:1.5px solid var(--danger);}

  .note{font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:18px;}

  /* PIN 잠금 화면 */
  #gate{
    position:fixed; inset:0; background:var(--brown);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; z-index:100;
  }
  #gate h2{color:var(--gold); font-weight:700; margin:0; letter-spacing:1px;}
  #gate p{color:rgba(255,255,255,.6); font-size:13px; margin:0;}
  #pin-input{
    font-size:22px; text-align:center; letter-spacing:8px; width:200px;
    padding:12px; border-radius:10px; border:1.5px solid var(--gold);
    background:rgba(255,255,255,.95); font-family:inherit;
  }
  #pin-err{color:#ffb4b4; font-size:13px; display:none;}
</style>
</head>
<body>

<!-- ===== PIN 잠금 ===== -->
<div id="gate">
  <h2>관리자 확인</h2>
  <p>PIN 번호를 입력하시오</p>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
  <div id="pin-err">PIN이 일치하지 않습니다.</div>
  <button class="btn-main" onclick="unlock()">확인</button>
</div>

<!-- ===== 대시보드 ===== -->
<header hidden id="hdr">
  <img src="seoulraim_logo.png" alt="">
  <h1>나도 복원가 — 플레이 집계</h1>
  <span class="sub">이 기기 기준</span>
</header>

<main hidden id="dash">
  <div class="cards">
    <div class="card primary"><div class="label">총 시행 횟수</div><div class="num" id="m-plays">0</div></div>
    <div class="card gold"><div class="label">완료 횟수</div><div class="num" id="m-comp">0</div></div>
    <div class="card"><div class="label">완료율</div><div class="num" id="m-rate">—</div></div>
    <div class="card"><div class="label">오늘</div><div class="num" id="m-today">0</div></div>
  </div>

  <div class="panel">
    <h2>기록 정보</h2>
    <div class="meta-row"><span>첫 기록</span><span id="m-first">—</span></div>
    <div class="meta-row"><span>마지막 기록</span><span id="m-last">—</span></div>
  </div>

  <div class="panel">
    <h2>최근 14일 일별 시행</h2>
    <div id="daily"></div>
  </div>

  <div class="actions">
    <button class="btn-ghost" onclick="render()">↻ 새로고침</button>
    <button class="btn-ghost" onclick="exportCSV()">⬇ CSV 내보내기</button>
    <button class="btn-danger" onclick="resetData()">기록 초기화</button>
  </div>

  <p class="note">
    이 수치는 <b>현재 이 기기(브라우저)</b>에서 일어난 플레이만 집계합니다. 여러 기기를 합산하지 않으며,
    브라우저 캐시·데이터를 지우면 기록도 함께 사라집니다. 정기적으로 <b>CSV 내보내기</b>로 백업해 두시길 권합니다.
  </p>
</main>

<script>
  // ⚠️ 관리자 PIN — 운영 시 반드시 아래 숫자를 바꾸시오. (소스에 노출되므로 강력한 보안은 아님)
  const ADMIN_PIN = '2026';
  const KEY = 'nrx_stats';

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const fmt = (n) => (n || 0).toLocaleString('ko-KR');
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  function unlock() {
    const v = document.getElementById('pin-input').value.trim();
    if (v === ADMIN_PIN) {
      document.getElementById('gate').remove();
      document.getElementById('hdr').hidden = false;
      document.getElementById('dash').hidden = false;
      render();
    } else {
      document.getElementById('pin-err').style.display = 'block';
    }
  }
  document.getElementById('pin-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

  function render() {
    const s = load();
    const plays = s.plays || 0, comp = s.completions || 0;
    document.getElementById('m-plays').textContent = fmt(plays);
    document.getElementById('m-comp').textContent = fmt(comp);
    document.getElementById('m-rate').textContent = plays ? Math.round(comp / plays * 100) + '%' : '—';
    document.getElementById('m-today').textContent = fmt((s.daily || {})[todayStr()] || 0);
    document.getElementById('m-first').textContent = s.firstPlay ? new Date(s.firstPlay).toLocaleString('ko-KR') : '기록 없음';
    document.getElementById('m-last').textContent = s.lastPlay ? new Date(s.lastPlay).toLocaleString('ko-KR') : '기록 없음';
    renderDaily(s.daily || {});
  }

  function renderDaily(daily) {
    const days = [], now = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      days.push({ label: (d.getMonth() + 1) + '/' + d.getDate(), n: daily[key] || 0 });
    }
    const max = Math.max(1, ...days.map(d => d.n));
    document.getElementById('daily').innerHTML = days.map(d => `
      <div class="bar-row">
        <span class="bar-label">${d.label}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(d.n / max * 100)}%"></span></span>
        <span class="bar-n">${d.n}</span>
      </div>`).join('');
  }

  function resetData() {
    const pin = prompt('초기화하려면 PIN을 다시 입력하시오:');
    if (pin === null) return;
    if (pin !== ADMIN_PIN) { alert('PIN이 일치하지 않습니다.'); return; }
    if (!confirm('이 기기의 모든 플레이 기록을 삭제합니다. 계속하시겠습니까?')) return;
    localStorage.removeItem(KEY);
    render();
    alert('초기화되었습니다.');
  }

  function exportCSV() {
    const s = load();
    const rows = [
      ['지표', '값'],
      ['총 시행 횟수', s.plays || 0],
      ['총 완료 횟수', s.completions || 0],
      ['첫 기록', s.firstPlay || ''],
      ['마지막 기록', s.lastPlay || ''],
      [],
      ['날짜', '시행 횟수']
    ];
    const daily = s.daily || {};
    Object.keys(daily).sort().forEach(k => rows.push([k, daily[k]]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nado-restorer-stats_' + todayStr() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
